name: Build and Release

on:
  release:
    types: [created]
  # Trigger manually from the GitHub Actions tab (Actions → Build and Release → Run workflow)
  workflow_dispatch:

# Required so GITHUB_TOKEN can upload assets to releases
permissions:
  contents: write

jobs:
  # ─── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    name: Build Windows (.exe installer)

    steps:
      - uses: actions/checkout@v4

      # ── Python backend ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install ffmpeg (required by Whisper + yt-dlp)
        run: choco install ffmpeg -y

      - name: Install Python dependencies + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Package backend with PyInstaller
        working-directory: backend
        run: >
          pyinstaller backend.spec
          --distpath ../backend-dist
          --workpath ../build/backend-work
          --noconfirm

      # ── React frontend ───────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ── Electron packager ────────────────────────────────────────────────
      - name: Install root Electron dependencies
        run: npm install

      - name: Build Windows NSIS installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/*.exe
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    name: Build macOS (.dmg)

    steps:
      - uses: actions/checkout@v4

      # ── Python backend ───────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install ffmpeg (required by Whisper + yt-dlp)
        run: brew install ffmpeg

      - name: Install Python dependencies + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Package backend with PyInstaller
        working-directory: backend
        run: >
          pyinstaller backend.spec
          --distpath ../backend-dist
          --workpath ../build/backend-work
          --noconfirm

      # ── React frontend ───────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # ── Electron packager ────────────────────────────────────────────────
      - name: Install root Electron dependencies
        run: npm install

      - name: Build macOS DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-electron/*.dmg
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Summary ────────────────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: always()
    name: Build Summary

    steps:
      - name: Report results
        run: |
          echo "Windows: ${{ needs.build-windows.result }}"
          echo "macOS:   ${{ needs.build-macos.result }}"
          if [[ "${{ needs.build-windows.result }}" == "success" && "${{ needs.build-macos.result }}" == "success" ]]; then
            echo "All builds succeeded"
          else
            echo "One or more builds failed"
            exit 1
          fi
